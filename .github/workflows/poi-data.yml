name: Données des points d'intérêt (OpenStreetMap)

# Extrait chaque mois l'eau, les refuges, les bivouacs, les commerces et les gares
# d'OpenStreetMap et les publie dans data/poi/ (servi par GitHub Pages).
# Les pays sont téléchargés région par région (fichiers plus petits, en parallèle,
# reprise automatique en cas de coupure) depuis Geofabrik.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 * *"          # le 2 de chaque mois à 03:17 UTC
  push:
    branches: [main]
    paths: ["tools/build_pois.py", ".github/workflows/poi-data.yml"]

permissions:
  contents: write

concurrency:
  group: poi-data
  cancel-in-progress: true

env:
  COUNTRIES: "france spain andorra norway switzerland italy"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
    steps:
      - id: plan
        name: Lister les régions à télécharger
        run: |
          curl -fsSL --retry 5 -o index.json https://download.geofabrik.de/index-v1-nogeom.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          feats = [f["properties"] for f in json.load(open("index.json"))["features"]]
          children = {}
          for p in feats: children.setdefault(p.get("parent"), []).append(p)
          byid = {p["id"]: p for p in feats}
          def leaves(i):
              kids = children.get(i, [])
              return [x for k in kids for x in leaves(k["id"])] if kids else [byid[i]]
          out = []
          for c in os.environ["COUNTRIES"].split():
              for p in leaves(c):
                  pbf = p["urls"]["pbf"]
                  out.append({"id": p["id"], "pbf": pbf, "poly": pbf.replace("-latest.osm.pbf", ".poly")})
          print("regions=" + json.dumps(out))
          EOF
          grep -o '"id"' "$GITHUB_OUTPUT" | wc -l

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - name: Installer osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Télécharger (avec reprise) et filtrer ${{ matrix.region.id }}
        run: |
          set -euo pipefail
          n="${{ matrix.region.id }}"
          curl -fsSL --retry 5 --retry-all-errors -o "$n.poly" "${{ matrix.region.poly }}"
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fSL -s -S --retry 3 --retry-all-errors -C - -o "$n.osm.pbf" "${{ matrix.region.pbf }}"; then ok=1; break; fi
            echo "Coupure, reprise ($i)…"; sleep 10
          done
          [ "$ok" = 1 ]
          osmium tags-filter "$n.osm.pbf" \
            nwr/tourism=alpine_hut,wilderness_hut,hostel,guest_house,camp_site,camp_pitch \
            nwr/amenity=shelter,drinking_water,water_point \
            nwr/natural=spring nwr/man_made=water_tap \
            nwr/shop=supermarket,convenience,general,bakery \
            nwr/railway=station,halt \
            -o "$n.f.osm.pbf" --overwrite
          osmium export "$n.f.osm.pbf" -f geojsonseq -a type,id -o "$n.geojsonseq" --overwrite
          mkdir out && mv "$n.geojsonseq" "$n.poly" out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: poi-${{ matrix.region.id }}
          path: out/
          retention-days: 3

  build:
    needs: extract
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                 # toujours la dernière version (aussi lors d'une relance)
      - uses: actions/download-artifact@v4
        with:
          pattern: poi-*
          merge-multiple: true
          path: work
      - name: Construire les tuiles
        run: |
          set -euo pipefail
          PAIRS=""
          for f in work/*.geojsonseq; do n="${f%.geojsonseq}"; PAIRS="$PAIRS $f:$n.poly"; done
          [ -n "$PAIRS" ] || { echo "Aucune région extraite"; exit 1; }
          python3 tools/build_pois.py data/poi $PAIRS
      - name: Publier si les données ont changé
        run: |
          git config user.name "orri-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poi
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Données OpenStreetMap du $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Nouvel essai ($i)…"; sleep 5
          done
          exit 1
